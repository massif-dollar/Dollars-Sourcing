<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<!-- L'ordre des mots compte : iOS force le thème sombre sans ça (piège 1). -->
<meta name="color-scheme" content="only dark">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La boutique — casquettes</title>
<meta name="description" content="La sélection du moment. Commande directement sur Snap.">
<meta name="theme-color" content="#0a0a0b">

<!-- Aperçu du lien : TikTok, Snap et iMessage lisent le HTML brut sans exécuter
     le moindre JavaScript. Ces balises-là sont donc les seules qui comptent
     pour ce que les gens voient avant de cliquer. -->
<meta property="og:title" content="La boutique — casquettes">
<meta property="og:description" content="La sélection du moment. Commande sur Snap.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">

<style>
/* ═══════════════════════════════════════════════════════════════
   TOUT CE QUI SE MODIFIE SANS TOUCHER AU DESSIN EST EN BAS DU
   FICHIER, dans le bloc CATALOGUE. Ici, c'est l'habillage.
   ═══════════════════════════════════════════════════════════════ */
:root{
  --bg:#0a0a0b;
  --surface:#131316;
  --surface-2:#1a1a1f;
  --line:rgba(255,255,255,.09);
  --text:#f4f4f5;
  --muted:#9c9ca5;
  --accent:#ff7a1a;              /* l'orange de la maison */
  --accent-soft:rgba(255,122,26,.14);
  --radius:20px;
  --ease:cubic-bezier(.22,1,.36,1);
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,system-ui,sans-serif;
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; padding:0; background:var(--bg); }
body{
  font-family:var(--font); color:var(--text);
  -webkit-font-smoothing:antialiased;
  /* La barre d'action est fixée en bas : on réserve sa hauteur pour que la
     dernière carte ne finisse jamais dessous. */
  padding-bottom:calc(104px + env(safe-area-inset-bottom));
  overflow-x:hidden;
}

/* ---- Le fond qui respire. Transform seul : c'est le GPU qui travaille. ---- */
#halo{
  position:fixed; inset:-30% -20% auto -20%; height:70vh; z-index:0;
  pointer-events:none; contain:strict;
  background:
    radial-gradient(42% 46% at 22% 30%, rgba(255,122,26,.20), transparent 70%),
    radial-gradient(38% 42% at 78% 18%, rgba(120,90,255,.14), transparent 72%);
  filter:blur(38px);
  animation:derive 41s var(--ease) infinite alternate;
}
@keyframes derive{
  from{ transform:translate3d(-3%,-2%,0) scale(1); }
  to  { transform:translate3d(4%,3%,0) scale(1.14); }
}

/* ---- En-tête ---- */
header{
  position:relative; z-index:1;
  padding:calc(44px + env(safe-area-inset-top)) 22px 26px;
  text-align:center;
}
.marque{
  font-size:13px; font-weight:800; letter-spacing:.22em; text-transform:uppercase;
  color:var(--accent); margin:0 0 14px;
}
h1{
  font-size:clamp(30px,8.6vw,42px); line-height:1.04; margin:0 0 12px;
  letter-spacing:-.035em; font-weight:800;
}
.sous{
  font-size:15px; line-height:1.55; color:var(--muted);
  margin:0 auto; max-width:22em;
}
.compte{
  display:inline-flex; align-items:center; gap:7px; margin-top:20px;
  padding:7px 14px; border-radius:999px;
  background:var(--accent-soft); border:.5px solid rgba(255,122,26,.3);
  font-size:12.5px; font-weight:650; color:var(--accent);
}
.point{ width:6px; height:6px; border-radius:50%; background:var(--accent); animation:bat 2.4s ease-in-out infinite; }
@keyframes bat{ 0%,100%{opacity:1; transform:scale(1);} 50%{opacity:.45; transform:scale(.8);} }

/* ---- Les articles ---- */
main{ position:relative; z-index:1; padding:8px 16px 0; max-width:560px; margin:0 auto; }
.carte{
  background:var(--surface); border:.5px solid var(--line);
  border-radius:var(--radius); overflow:hidden; margin-bottom:16px;
  box-shadow:0 1px 2px rgba(0,0,0,.4), 0 14px 34px rgba(0,0,0,.34);
  /* Révélée en montant quand elle arrive à l'écran. */
  opacity:0; transform:translateY(22px);
  transition:opacity .62s var(--ease), transform .62s var(--ease);
}
.carte.vu{ opacity:1; transform:none; }

.photo{
  position:relative; display:block; width:100%; aspect-ratio:1/1;
  background:linear-gradient(145deg,var(--surface-2),#0f0f12);
  overflow:hidden;
}
.photo img{ width:100%; height:100%; object-fit:cover; display:block; }
/* Le reflet qui balaie : c'est ce qui fait lire la surface comme du verre
   plutôt que comme un rectangle. */
.photo::after{
  content:''; position:absolute; inset:0;
  background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.09) 48%,transparent 58%);
  transform:translateX(-120%);
}
.carte.vu .photo::after{ animation:balaye 1.25s var(--ease) .18s 1; }
@keyframes balaye{ to{ transform:translateX(120%); } }

/* La place de la photo quand il n'y en a pas encore : ça doit rester beau,
   pas cassé. */
.vide{ position:absolute; inset:0; display:grid; place-items:center; gap:10px; }
.vide svg{ width:64px; height:64px; opacity:.16; }
.vide span{ font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); opacity:.6; }

.corps{ padding:17px 18px 19px; }
.ligne{ display:flex; align-items:baseline; justify-content:space-between; gap:14px; }
.nom{ font-size:17.5px; font-weight:700; letter-spacing:-.02em; margin:0; }
.prix{
  font-size:17.5px; font-weight:800; color:var(--accent);
  font-variant-numeric:tabular-nums; white-space:nowrap;
}
.desc{ font-size:13.5px; line-height:1.5; color:var(--muted); margin:8px 0 0; }
.etiquettes{ display:flex; flex-wrap:wrap; gap:6px; margin-top:13px; }
.etq{
  font-size:11.5px; font-weight:600; padding:4.5px 10px; border-radius:999px;
  background:var(--surface-2); border:.5px solid var(--line); color:var(--muted);
}
.etq.dispo{ color:var(--accent); background:var(--accent-soft); border-color:rgba(255,122,26,.28); }

/* Le bouton de la carte. UN VRAI LIEN, jamais un window.open() : c'est la
   condition pour qu'iOS passe la main à l'application Snapchat au lieu de
   charger la page dans le navigateur (piège 17 de DOLLAR$). */
/* Le bouton de la carte est SECONDAIRE, et c'est voulu : plein orange, il
   entrait en collision avec la barre fixe — deux pastilles identiques l'une
   sur l'autre, sans hiérarchie. Une seule action pleine par écran. */
.acheter{
  display:flex; align-items:center; justify-content:center; gap:8px;
  margin-top:16px; padding:13px; border-radius:14px;
  background:transparent; color:var(--accent); text-decoration:none;
  border:1px solid rgba(255,122,26,.42);
  font-size:14.5px; font-weight:700; letter-spacing:-.01em;
  transition:transform .16s var(--ease), background .16s var(--ease);
}
.acheter:active{ transform:scale(.975); background:var(--accent-soft); }
.acheter svg{ width:16px; height:16px; }

/* ---- La barre fixe : l'action est toujours sous le pouce ---- */
.barre{
  position:fixed; left:0; right:0; bottom:0; z-index:5;
  padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,rgba(10,10,11,.97) 62%,rgba(10,10,11,0));
  backdrop-filter:blur(16px) saturate(150%);
  -webkit-backdrop-filter:blur(16px) saturate(150%);
}
.barre-inner{ max-width:560px; margin:0 auto; }
.cta{
  display:flex; align-items:center; justify-content:center; gap:9px;
  padding:16px; border-radius:16px; text-decoration:none;
  background:var(--accent); color:#0a0a0b;
  font-size:16px; font-weight:800; letter-spacing:-.015em;
  box-shadow:0 6px 22px rgba(255,122,26,.3);
  transition:transform .16s var(--ease), filter .16s var(--ease);
}
.cta:active{ transform:scale(.978); filter:brightness(.92); }
.cta svg{ width:19px; height:19px; }

footer{
  position:relative; z-index:1; text-align:center;
  padding:26px 22px 34px; font-size:11.5px; line-height:1.7; color:var(--muted); opacity:.5;
}

/* Accélérer une animation infinie la fait clignoter : on la coupe. */
@media (prefers-reduced-motion:reduce){
  #halo{ animation:none; }
  .point{ animation:none; }
  .carte{ opacity:1; transform:none; transition:none; }
  .carte.vu .photo::after{ animation:none; }
}
</style>
</head>
<body>
<div id="halo"></div>

<header>
  <p class="marque" id="marque">—</p>
  <h1 id="titre">—</h1>
  <p class="sous" id="sous">—</p>
  <div class="compte"><i class="point"></i><span id="compte">—</span></div>
</header>

<main id="grille"></main>

<div class="barre">
  <div class="barre-inner">
    <!-- Un vrai lien, encore : c'est ce qui ouvre l'application Snapchat. -->
    <a class="cta" id="ctaSnap" href="#">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.2c2.9 0 5 2.2 5 5.2 0 .9-.1 1.7-.1 2.3.3.2.7.3 1.1.2.5-.1 1 .1 1.1.5.2.5-.2.9-.9 1.2-.7.3-1.5.5-1.5 1 0 .6 1.7 3 4 3.6.3.1.5.3.4.6-.1.5-1 .9-2.3 1.1-.2 0-.3.2-.3.4-.1.3-.1.6-.2.8-.1.2-.2.3-.5.3-.5 0-1.2-.2-2.1-.2-1.4 0-1.9.2-2.8 1-.8.6-1.6 1-2.6 1s-1.8-.4-2.6-1c-.9-.8-1.4-1-2.8-1-.9 0-1.6.2-2.1.2-.3 0-.4-.1-.5-.3-.1-.2-.1-.5-.2-.8 0-.2-.1-.4-.3-.4-1.3-.2-2.2-.6-2.3-1.1-.1-.3.1-.5.4-.6 2.3-.6 4-3 4-3.6 0-.5-.8-.7-1.5-1-.7-.3-1.1-.7-.9-1.2.1-.4.6-.6 1.1-.5.4.1.8 0 1.1-.2 0-.6-.1-1.4-.1-2.3 0-3 2.1-5.2 5-5.2z"/></svg>
      <span id="ctaTexte">—</span>
    </a>
  </div>
</div>

<footer id="pied">—</footer>

<script>
/* ═══════════════════════════════════════════════════════════════════════
   LE CATALOGUE — c'est la SEULE partie à modifier.

   Pour ajouter un modèle : recopie un bloc entre accolades et change les
   valeurs. Pour en retirer un : supprime son bloc. Le dessin s'adapte tout
   seul, il n'y a jamais besoin de toucher au reste du fichier.

   Pour la photo : dépose l'image dans le dossier `photos/` du dépôt et mets
   son nom ici (par exemple "photos/casquette-noire.jpg"). Laisse la chaîne
   vide tant que tu n'as pas la photo : la carte reste belle, avec un
   emplacement dessiné au lieu d'une image cassée.
   ═══════════════════════════════════════════════════════════════════════ */

const SNAP = 'TON_PSEUDO_SNAP';        // ← ton pseudo Snapchat, sans le @

const MARQUE   = 'La sélection';
const TITRE    = 'Casquettes';
const SOUSTITRE= 'Pièces choisies une par une. Commande directement sur Snap, je réponds vite.';
const PIED     = 'Envoi sous 48 h · Paiement à la commande · Écris-moi sur Snap pour toute question';

const CATALOGUE = [
  {
    nom: 'Modèle 1',
    prix: '25 €',
    desc: 'Décris-la en une ligne : matière, coupe, ce qui la rend bien.',
    photo: '',                          // ex. 'photos/modele-1.jpg'
    etiquettes: ['Taille unique', 'Neuve'],
    dispo: true
  },
  {
    nom: 'Modèle 2',
    prix: '25 €',
    desc: 'Décris-la en une ligne : matière, coupe, ce qui la rend bien.',
    photo: '',
    etiquettes: ['Taille unique', 'Neuve'],
    dispo: true
  }
];

/* ═══════════════════════════════════════════════════════════════════════
   À partir d'ici, plus rien à modifier.
   ═══════════════════════════════════════════════════════════════════════ */

const $ = (s) => document.querySelector(s);

// Le lien qui ouvre Snapchat. On le construit une fois et on le POSE sur les
// liens : jamais de window.open(), qui ne réveille pas l'application sur iOS.
const LIEN_SNAP = 'https://www.snapchat.com/add/' + encodeURIComponent(SNAP);

// L'icône d'emplacement, quand la photo manque encore. Une icône de PHOTO, pas
// une silhouette de casquette : un dessin d'objet se lit comme le produit
// lui-même — le premier jet ressemblait à une cloche de restaurant. Ici, le
// message doit être « il manque l'image », rien d'autre.
const SILHOUETTE = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"
  stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/>
  <circle cx="8.6" cy="10.2" r="1.7"/><path d="M21 15.5l-4.8-4.6L8 19"/></svg>`;

// Les textes qui viennent du catalogue : on les pose comme TEXTE, jamais comme
// HTML. Une apostrophe ou un chevron dans un nom de produit ne doit pas pouvoir
// casser la page — ni y injecter quoi que ce soit.
function poser(el, txt){ el.textContent = txt; }

function carte(article){
  const el = document.createElement('article');
  el.className = 'carte';

  const media = document.createElement('a');
  media.className = 'photo';
  media.href = LIEN_SNAP;
  media.target = '_blank';
  media.rel = 'noopener';

  if(article.photo){
    const img = document.createElement('img');
    img.src = article.photo;
    img.alt = article.nom;
    img.loading = 'lazy';
    img.decoding = 'async';
    // Une photo manquante ne laisse pas un cadre cassé : on retombe sur
    // l'emplacement dessiné.
    img.onerror = ()=>{ img.remove(); media.appendChild(emplacement()); };
    media.appendChild(img);
  } else {
    media.appendChild(emplacement());
  }

  const corps = document.createElement('div');
  corps.className = 'corps';

  const ligne = document.createElement('div');
  ligne.className = 'ligne';
  const nom = document.createElement('h2');  nom.className = 'nom';  poser(nom, article.nom);
  const prix = document.createElement('div'); prix.className = 'prix'; poser(prix, article.prix);
  ligne.append(nom, prix);
  corps.appendChild(ligne);

  if(article.desc){
    const d = document.createElement('p'); d.className = 'desc'; poser(d, article.desc);
    corps.appendChild(d);
  }

  const etqs = [];
  if(article.dispo) etqs.push(['Disponible', true]);
  (article.etiquettes || []).forEach(t => etqs.push([t, false]));
  if(etqs.length){
    const box = document.createElement('div'); box.className = 'etiquettes';
    etqs.forEach(([t, fort])=>{
      const s = document.createElement('span');
      s.className = 'etq' + (fort ? ' dispo' : '');
      poser(s, t);
      box.appendChild(s);
    });
    corps.appendChild(box);
  }

  const btn = document.createElement('a');
  btn.className = 'acheter';
  btn.href = LIEN_SNAP;
  btn.target = '_blank';
  btn.rel = 'noopener';
  btn.innerHTML = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.2c2.9 0 5 2.2 5 5.2 0 .9-.1 1.7-.1 2.3.3.2.7.3 1.1.2.5-.1 1 .1 1.1.5.2.5-.2.9-.9 1.2-.7.3-1.5.5-1.5 1 0 .6 1.7 3 4 3.6.3.1.5.3.4.6-.1.5-1 .9-2.3 1.1-.2 0-.3.2-.3.4-.1.3-.1.6-.2.8-.1.2-.2.3-.5.3-.5 0-1.2-.2-2.1-.2-1.4 0-1.9.2-2.8 1-.8.6-1.6 1-2.6 1s-1.8-.4-2.6-1c-.9-.8-1.4-1-2.8-1-.9 0-1.6.2-2.1.2-.3 0-.4-.1-.5-.3-.1-.2-.1-.5-.2-.8 0-.2-.1-.4-.3-.4-1.3-.2-2.2-.6-2.3-1.1-.1-.3.1-.5.4-.6 2.3-.6 4-3 4-3.6 0-.5-.8-.7-1.5-1-.7-.3-1.1-.7-.9-1.2.1-.4.6-.6 1.1-.5.4.1.8 0 1.1-.2 0-.6-.1-1.4-.1-2.3 0-3 2.1-5.2 5-5.2z"/></svg>`;
  const lbl = document.createElement('span');
  poser(lbl, 'Je la veux — écris-moi');
  btn.appendChild(lbl);
  corps.appendChild(btn);

  el.append(media, corps);
  return el;
}

function emplacement(){
  const v = document.createElement('div');
  v.className = 'vide';
  v.innerHTML = SILHOUETTE;
  const s = document.createElement('span');
  poser(s, 'Photo à venir');
  v.appendChild(s);
  return v;
}

function rendu(){
  poser($('#marque'), MARQUE);
  poser($('#titre'),  TITRE);
  poser($('#sous'),   SOUSTITRE);
  poser($('#pied'),   PIED);
  poser($('#compte'), CATALOGUE.length + (CATALOGUE.length > 1 ? ' modèles disponibles' : ' modèle disponible'));

  $('#ctaSnap').href = LIEN_SNAP;
  poser($('#ctaTexte'), 'Commander sur Snap');

  const grille = $('#grille');
  grille.innerHTML = '';
  CATALOGUE.forEach(a => grille.appendChild(carte(a)));

  // Les cartes se révèlent à l'arrivée à l'écran. Un IntersectionObserver, et
  // surtout pas un écouteur de défilement : le navigateur prévient, on ne
  // l'interroge pas à chaque pixel.
  const bouge = !window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  if(!bouge || !('IntersectionObserver' in window)){
    grille.querySelectorAll('.carte').forEach(c => c.classList.add('vu'));
    return;
  }
  const obs = new IntersectionObserver((entrees)=>{
    entrees.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('vu'); obs.unobserve(e.target); } });
  }, { rootMargin:'0px 0px -8% 0px', threshold:.08 });
  grille.querySelectorAll('.carte').forEach(c => obs.observe(c));
}

rendu();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr" style="background:#ffffff;">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="color-scheme" content="only light">
<meta name="theme-color" content="#ffffff">
<title>Mon espace client — DOLLAR$ SOURCING</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme:only light;
    --bg:#ffffff;
    --glass:rgba(142,142,138,0.10);
    --glass-strong:rgba(142,142,138,0.18);
    --glass-border:rgba(120,118,114,0.18);
    --glass-shadow:0 10px 26px rgba(0,0,0,0.06);
    --glass-highlight:inset 0 1px 0 rgba(255,255,255,0.9);
    --text:#1a1a1c;
    --text-muted:#7a7b78;
    --text-faint:#a8a9a6;
    --teal:#d3283a;
    --danger:#d3283a;
    --radius:20px;
    --radius-sm:13px;
    --font-display:'Space Grotesk',sans-serif;
    --font-body:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    --st-nouveau:#b5b6b2; --st-devis:#8f908c; --st-paye:#1a1a1c; --st-commande:#707169;
    --st-expedie:#4d4e49; --st-livre:#2a2a28; --st-annule:#d3283a; --st-attente:#d99a2b;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--text); font-family:var(--font-body);
    min-height:100vh; position:relative; overflow-x:hidden;
  }
  body::before{
    content:''; position:fixed; inset:0;
    background:
      radial-gradient(circle at 15% -5%, rgba(20,20,22,0.05), transparent 42%),
      radial-gradient(circle at 90% 100%, rgba(211,40,58,0.12), transparent 45%);
    pointer-events:none; z-index:0;
  }
  #app{ position:relative; z-index:1; max-width:520px; margin:0 auto; padding:26px 16px 60px; }
  header{ text-align:center; margin-bottom:20px; }
  .brand{ font-family:var(--font-display); font-size:12px; font-weight:700; letter-spacing:.08em; color:var(--text-faint); text-transform:uppercase; }
  header h1{ font-family:var(--font-display); font-size:23px; font-weight:600; margin:6px 0 2px; letter-spacing:-0.01em; }
  header p{ margin:0; font-size:13px; color:var(--text-muted); }

  .tabs{ display:flex; gap:7px; margin-bottom:18px; }
  .tab{
    flex:1; padding:10px 8px; border-radius:100px; font-size:13px; font-weight:600; text-align:center;
    background:var(--glass); border:1px solid var(--glass-border); color:var(--text-muted); cursor:pointer;
    transition:background .2s ease, color .2s ease, border-color .2s ease;
  }
  .tab.active{ background:var(--teal); border-color:var(--teal); color:#fff; }

  .card{
    background:var(--glass); border:1px solid var(--glass-border); border-radius:var(--radius);
    padding:18px 16px; box-shadow:var(--glass-shadow), var(--glass-highlight);
  }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12.5px; color:var(--text-muted); margin-bottom:5px; font-weight:500; }
  .field input, .field textarea{
    width:100%; background:#fff; border:1px solid var(--glass-border); color:var(--text);
    border-radius:11px; padding:11px 13px; font-family:var(--font-body); font-size:14.5px; resize:vertical;
  }
  .field-error{ display:none; color:var(--danger); font-size:11.5px; margin-top:5px; }
  .field.invalid input, .field.invalid textarea{ border-color:var(--danger); }
  .field.invalid .field-error{ display:block; }
  .row2{ display:grid; grid-template-columns:2fr 1fr; gap:10px; }

  .btn-primary{
    width:100%; padding:14px; border-radius:13px; border:none; background:var(--teal); color:#fff;
    font-weight:700; font-size:15px; cursor:pointer; margin-top:4px; transition:transform .1s ease;
  }
  .btn-primary:active{ transform:scale(0.98); }
  .btn-primary:disabled{ opacity:.5; cursor:default; }

  .list{ display:flex; flex-direction:column; gap:9px; }
  .empty{ text-align:center; padding:40px 20px; color:var(--text-faint); font-size:13.5px; line-height:1.6; }
  .order-card{
    background:var(--glass); border:1px solid var(--glass-border); border-radius:16px; padding:13px 14px;
    box-shadow:var(--glass-shadow), var(--glass-highlight); animation:cardIn .35s ease backwards;
  }
  @keyframes cardIn{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
  .card-top{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .card-top .product{ font-weight:600; font-size:14.5px; }
  .badge{ font-size:10.5px; font-weight:600; padding:3px 9px; border-radius:100px; white-space:nowrap; flex-shrink:0; }
  .card-mid{ font-size:12.5px; color:var(--text-muted); margin-top:5px; font-style:italic; }
  .card-bottom{ margin-top:8px; font-size:11.5px; color:var(--text-faint); }

  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(8px);
    background:#232428; border:1px solid rgba(255,255,255,0.1); color:#f2f1ec;
    padding:11px 18px; border-radius:100px; font-size:13px; z-index:50; max-width:88vw; text-align:center;
    opacity:0; transition:opacity .25s, transform .25s; pointer-events:none;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  .error-screen{ text-align:center; padding:80px 24px; }
  .error-screen .icon{ font-size:40px; margin-bottom:14px; }
  .error-screen h2{ font-family:var(--font-display); font-size:19px; margin:0 0 8px; }
  .error-screen p{ color:var(--text-muted); font-size:14px; line-height:1.6; margin:0; }

  #loadingScreen{ text-align:center; padding:100px 24px; color:var(--text-faint); font-size:14px; }

  @media (min-width:700px){ #app{ max-width:600px; } }
</style>
</head>
<body>
<div id="app" style="display:none;">
  <header>
    <div class="brand">DOLLAR$ SOURCING</div>
    <h1 id="greeting">Bonjour</h1>
    <p>Espace de commande personnel</p>
  </header>

  <div class="tabs">
    <button class="tab active" id="tabOrder">Nouvelle commande</button>
    <button class="tab" id="tabHistory">Mes commandes</button>
  </div>

  <div id="orderPanel">
    <div class="card">
      <form id="orderForm" novalidate>
        <div class="field">
          <label>Produit</label>
          <input type="text" id="f_product" placeholder="Ex: paire de chaussures, sac...">
          <div class="field-error"></div>
        </div>
        <div class="row2">
          <div class="field">
            <label>Quantité</label>
            <input type="number" id="f_qty" min="1" value="1">
            <div class="field-error"></div>
          </div>
        </div>
        <div class="field">
          <label>Précisions (taille, couleur, référence...)</label>
          <textarea id="f_note" rows="3" placeholder="Optionnel"></textarea>
        </div>
        <button type="submit" class="btn-primary" id="submitBtn">Envoyer ma commande</button>
      </form>
    </div>
  </div>

  <div id="historyPanel" style="display:none;">
    <div class="list" id="historyList"></div>
  </div>
</div>

<div id="loadingScreen">Chargement...</div>
<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script>
// ==== Même projet Firebase que l'app pro ====
const firebaseConfig = {
  apiKey: "AIzaSyC8O6YqLkxmNoPtTGXm0d25IEyqvB8PZfg",
  authDomain: "dollar-sourcing.firebaseapp.com",
  projectId: "dollar-sourcing",
  storageBucket: "dollar-sourcing.firebasestorage.app",
  messagingSenderId: "1023577527754",
  appId: "1:1023577527754:web:74d55f10bb11807ec4eb33"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const $ = (sel)=>document.querySelector(sel);

const STATUS_META = {
  nouveau:{ label:'Nouvelle demande', color:'var(--st-nouveau)' },
  devis:{ label:'Devis envoyé', color:'var(--st-devis)' },
  paye:{ label:'Payé', color:'var(--st-paye)' },
  commande:{ label:'Commandé usine', color:'var(--st-commande)' },
  expedie:{ label:'Expédié', color:'var(--st-expedie)' },
  livre:{ label:'Livré', color:'var(--st-livre)' },
  annule:{ label:'Annulé', color:'var(--st-annule)' }
};

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtDate(ts){
  if(!ts) return '';
  const diffDays = Math.floor((Date.now()-ts)/86400000);
  if(diffDays===0) return "aujourd'hui";
  if(diffDays===1) return 'hier';
  if(diffDays<7) return `il y a ${diffDays}j`;
  return new Date(ts).toLocaleDateString('fr-FR', {day:'2-digit', month:'2-digit'});
}
function showToast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2600);
}
function setFieldError(input, message){
  const field = input.closest('.field');
  field.classList.add('invalid');
  let err = field.querySelector('.field-error');
  err.textContent = message;
}
function clearFormErrors(){
  document.querySelectorAll('.field.invalid').forEach(f=>f.classList.remove('invalid'));
}

// ---- Lecture du lien (?id=...&token=...) ----
const params = new URLSearchParams(location.search);
const clientId = params.get('id');
const clientToken = params.get('token');

let clientData = null;
let ordersUnsub = null;
let pendingUnsub = null;
let myOrders = [];
let myPending = [];

function showError(title, text){
  $('#loadingScreen').innerHTML = `
    <div class="error-screen">
      <div class="icon">🔒</div>
      <h2>${escapeHtml(title)}</h2>
      <p>${escapeHtml(text)}</p>
    </div>`;
}

async function init(){
  if(!clientId || !clientToken){
    showError('Lien invalide', "Ce lien n'est pas complet. Demande un nouveau lien à ton vendeur.");
    return;
  }
  try{
    const doc = await db.collection('clients').doc(clientId).get();
    if(!doc.exists || doc.data().token !== clientToken){
      showError('Lien invalide ou expiré', 'Ce lien ne correspond à aucun compte actif. Demande un nouveau lien à ton vendeur.');
      return;
    }
    clientData = Object.assign({id:doc.id}, doc.data());
    $('#greeting').textContent = 'Bonjour ' + clientData.name;
    $('#loadingScreen').style.display = 'none';
    $('#app').style.display = 'block';
    listenOrders();
  }catch(e){
    showError('Connexion impossible', 'Vérifie ta connexion internet et réessaie.');
  }
}

function listenOrders(){
  ordersUnsub = db.collection('orders').where('clientId','==',clientId).onSnapshot(snap=>{
    myOrders = snap.docs.map(d=>Object.assign({id:d.id}, d.data())).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    renderHistory();
  });
  pendingUnsub = db.collection('pendingOrders').where('clientId','==',clientId).onSnapshot(snap=>{
    myPending = snap.docs.map(d=>Object.assign({id:d.id}, d.data())).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    renderHistory();
  });
}

function renderHistory(){
  const el = $('#historyList');
  const pendingCards = myPending.map(p=>`
    <div class="order-card">
      <div class="card-top">
        <div class="product">${escapeHtml(p.product)} × ${p.qty}</div>
        <div class="badge" style="background:color-mix(in srgb, var(--st-attente) 18%, white); color:var(--st-attente);">En attente de validation</div>
      </div>
      ${p.note ? `<div class="card-mid">"${escapeHtml(p.note)}"</div>` : ''}
      <div class="card-bottom">${fmtDate(p.createdAt)}</div>
    </div>`).join('');
  const orderCards = myOrders.map(o=>{
    const meta = STATUS_META[o.status] || STATUS_META.nouveau;
    return `
    <div class="order-card">
      <div class="card-top">
        <div class="product">${escapeHtml(o.product)} × ${o.qty}</div>
        <div class="badge" style="background:color-mix(in srgb, ${meta.color} 18%, white); color:${meta.color};">${meta.label}</div>
      </div>
      ${o.note ? `<div class="card-mid">${escapeHtml(o.note)}</div>` : ''}
      <div class="card-bottom">${fmtDate(o.createdAt)}</div>
    </div>`;
  }).join('');
  const html = pendingCards + orderCards;
  el.innerHTML = html || `<div class="empty">Tu n'as pas encore de commande.<br>Utilise l'onglet "Nouvelle commande" pour en envoyer une.</div>`;
}

// ---- Tabs ----
$('#tabOrder').addEventListener('click', ()=>{
  $('#tabOrder').classList.add('active'); $('#tabHistory').classList.remove('active');
  $('#orderPanel').style.display='block'; $('#historyPanel').style.display='none';
});
$('#tabHistory').addEventListener('click', ()=>{
  $('#tabHistory').classList.add('active'); $('#tabOrder').classList.remove('active');
  $('#historyPanel').style.display='block'; $('#orderPanel').style.display='none';
});

// ---- Envoi de la demande ----
$('#orderForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  clearFormErrors();
  let valid = true;

  const product = $('#f_product').value.trim();
  if(!product){ setFieldError($('#f_product'), 'Indique un produit'); valid = false; }

  const qtyVal = parseInt($('#f_qty').value);
  if(!qtyVal || qtyVal<1){ setFieldError($('#f_qty'), 'Quantité invalide'); valid = false; }

  if(!valid) return;

  const submitBtn = $('#submitBtn');
  submitBtn.disabled = true;
  submitBtn.textContent = 'Envoi...';
  try{
    await db.collection('pendingOrders').add({
      clientId: clientId,
      clientName: clientData.name,
      token: clientToken,
      product,
      qty: qtyVal,
      note: $('#f_note').value.trim(),
      createdAt: Date.now()
    });
    $('#orderForm').reset();
    $('#f_qty').value = 1;
    showToast('Commande envoyée ! Ton vendeur va la valider.');
  }catch(e){
    showToast("Erreur d'envoi, réessaie.");
  }
  submitBtn.disabled = false;
  submitBtn.textContent = 'Envoyer ma commande';
});

init();
</script>
</body>
</html>

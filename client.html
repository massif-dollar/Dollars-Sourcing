<!DOCTYPE html>
<html lang="fr" data-theme="light" style="background:#fbfcfa;">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="color-scheme" content="only light">
<meta name="theme-color" content="#ffffff">
<title>Mon espace client — DOLLAR$ SOURCING</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --danger:#e0293c;
    --danger-bright:#f25060;
    --font-display:'Space Grotesk',sans-serif;
    --font-body:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    --spring:cubic-bezier(.34,1.4,.64,1);
    --ease-out:cubic-bezier(.22,.7,.3,1);
    --ease-io:cubic-bezier(.4,0,.2,1);
    --radius:20px;
    --radius-sm:14px;
  }

  html[data-theme="light"]{
    --bg:#fbfcfa;
    --bg-elevated:#ffffff;
    --tint-1:rgba(46,179,92,0.055);
    --tint-2:rgba(142,142,138,0.09);

    --accent:#2eb35c;
    --accent-bright:#5fe08c;
    --accent-deep:#1e8a44;
    --accent-soft:rgba(46,179,92,0.14);

    --text:#2b302c;
    --text-muted:#5f645e;
    --text-faint:#8d918a;
    --text-ghost:#b3b7b0;

    --fill:rgba(142,142,138,0.10);
    --fill-2:rgba(142,142,138,0.17);
    --hairline:rgba(120,120,114,0.16);
    --hairline-strong:rgba(120,120,114,0.28);
    --mat:rgba(255,255,255,0.78);
    --mat-thick:rgba(255,255,255,0.94);
    --sheet-bg:#ffffff;

    --raise:0 1px 1.5px rgba(70,74,68,0.05), 0 6px 16px rgba(70,74,68,0.06);
    --raise-lg:0 2px 4px rgba(70,74,68,0.05), 0 20px 40px rgba(70,74,68,0.10);
    --press:inset 0 3px 8px rgba(70,74,68,0.15), inset 0 1px 2px rgba(70,74,68,0.10);
    --specular:linear-gradient(163deg, rgba(255,255,255,0.96), rgba(255,255,255,0.18) 40%, transparent 68%);
    --ripple:rgba(46,179,92,0.26);
    --on-accent:#ffffff;
    --scrim:rgba(46,50,46,0.32);

    --st-nouveau:#a9ada6;
    --st-devis:#8d918a;
    --st-paye:#2eb35c;
    --st-commande:#6f736d;
    --st-expedie:#4a4e48;
    --st-livre:#1e8a44;
    --st-annule:#e0293c;
    --st-attente:#d99a2b;
  }

  html[data-theme="dark"]{
    --bg:#0a0a0b;
    --bg-elevated:#151516;
    --tint-1:rgba(255,122,26,0.10);
    --tint-2:rgba(142,142,138,0.07);

    --accent:#ff7a1a;
    --accent-bright:#ffb066;
    --accent-deep:#d85f00;
    --accent-soft:rgba(255,122,26,0.20);

    --text:#f3f2ef;
    --text-muted:#a9aaa4;
    --text-faint:#7c7d76;
    --text-ghost:#55564f;

    --fill:rgba(142,142,138,0.12);
    --fill-2:rgba(142,142,138,0.20);
    --hairline:rgba(142,142,138,0.20);
    --hairline-strong:rgba(142,142,138,0.36);
    --mat:rgba(28,28,30,0.74);
    --mat-thick:rgba(28,28,30,0.94);
    --sheet-bg:#151516;

    --raise:0 1px 2px rgba(0,0,0,0.5), 0 8px 22px rgba(0,0,0,0.42);
    --raise-lg:0 2px 6px rgba(0,0,0,0.55), 0 24px 48px rgba(0,0,0,0.5);
    --press:inset 0 3px 9px rgba(0,0,0,0.62), inset 0 1px 2px rgba(0,0,0,0.5);
    --specular:linear-gradient(163deg, rgba(255,255,255,0.15), rgba(255,255,255,0.03) 40%, transparent 68%);
    --ripple:rgba(255,122,26,0.30);
    --on-accent:#1c0d00;
    --scrim:rgba(0,0,0,0.6);

    --st-nouveau:#7c7d76;
    --st-devis:#9d9e98;
    --st-paye:#ff7a1a;
    --st-commande:#b0b1aa;
    --st-expedie:#ffb066;
    --st-livre:#ff9440;
    --st-annule:#e0293c;
    --st-attente:#d99a2b;
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--text); font-family:var(--font-body);
    font-size:16px; line-height:1.45; -webkit-font-smoothing:antialiased;
    min-height:100vh; position:relative; overflow-x:hidden;
    transition:background .45s var(--ease-io), color .45s var(--ease-io);
  }
  #bgfill{
    position:fixed; inset:0; z-index:-1; pointer-events:none;
    background:var(--bg); transition:background .45s var(--ease-io);
  }
  body::before{
    content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(95% 50% at 8% -12%, var(--tint-1), transparent 60%),
      radial-gradient(85% 46% at 96% 108%, var(--tint-2), transparent 62%);
    transition:background .45s var(--ease-io);
  }
  .tnum{ font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1; }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:3px; }

  /* ===== Surface tactile (liquid glass) ===== */
  .tap{
    position:relative; overflow:hidden; cursor:pointer;
    -webkit-user-select:none; user-select:none; transform:translateZ(0);
    transition:transform .44s var(--spring), box-shadow .3s var(--ease-io),
               background .45s var(--ease-io), border-color .45s var(--ease-io);
  }
  .tap::after{
    content:''; position:absolute; inset:0; pointer-events:none;
    background:var(--specular); opacity:.6;
    transition:opacity .28s var(--ease-io), transform .44s var(--spring);
  }
  .tap.is-pressed{ transform:scale(.968); }
  .tap.is-pressed::after{ opacity:.2; transform:translateY(2px); }
  .tap .ripple{
    position:absolute; border-radius:50%; pointer-events:none; display:block; z-index:0;
    background:radial-gradient(circle, var(--ripple) 0%, transparent 66%);
    transform:translate(-50%,-50%) scale(0);
    animation:rippleOut .6s var(--ease-out) forwards;
  }
  @keyframes rippleOut{ to{ transform:translate(-50%,-50%) scale(1); opacity:0; } }

  /* ===== Portail client ===== */
  #app{
    position:relative; z-index:1; max-width:520px; margin:0 auto;
    padding:calc(env(safe-area-inset-top) + 28px) 18px calc(env(safe-area-inset-bottom) + 60px);
  }
  header{ text-align:center; margin-bottom:26px; }
  .brand{
    font-family:var(--font-display); font-size:11.5px; font-weight:700; letter-spacing:.1em;
    color:var(--text-ghost); text-transform:uppercase;
  }
  header h1{ font-family:var(--font-display); font-size:26px; font-weight:700; margin:8px 0 3px; letter-spacing:-0.03em; }
  header p{ margin:0; font-size:13px; color:var(--text-faint); letter-spacing:-0.01em; }

  .tabs{ display:flex; gap:8px; margin-bottom:20px; }
  .tab{
    flex:1; padding:11px 8px; border-radius:100px; font-size:13.5px; font-weight:600; text-align:center;
    background:var(--fill); border:0.5px solid var(--hairline); color:var(--text-faint); cursor:pointer;
    letter-spacing:-0.01em; position:relative; overflow:hidden;
    -webkit-user-select:none; user-select:none; box-shadow:var(--raise);
    transition:transform .44s var(--spring), background .3s var(--ease-io),
               color .3s var(--ease-io), border-color .3s var(--ease-io);
  }
  .tab.is-pressed{ transform:scale(.96); }
  .tab.active{ background:var(--accent); border-color:transparent; color:var(--on-accent); }
  .tab .ripple{
    position:absolute; border-radius:50%; pointer-events:none; display:block; z-index:0;
    background:radial-gradient(circle, rgba(255,255,255,.35) 0%, transparent 66%);
    transform:translate(-50%,-50%) scale(0);
    animation:rippleOut .6s var(--ease-out) forwards;
  }

  .card{
    background:var(--mat); border:0.5px solid var(--hairline); border-radius:var(--radius);
    padding:20px 17px; box-shadow:var(--raise);
    backdrop-filter:blur(20px) saturate(170%); -webkit-backdrop-filter:blur(20px) saturate(170%);
    transition:background .45s var(--ease-io), border-color .45s var(--ease-io);
  }

  .field{ margin-bottom:15px; }
  .field label{ display:block; font-size:12.5px; color:var(--text-muted); margin-bottom:6px; font-weight:500; letter-spacing:-0.01em; }
  .field input, .field textarea{
    width:100%; background:var(--bg-elevated); border:0.5px solid var(--hairline); color:var(--text);
    border-radius:12px; padding:12px 14px; font-family:var(--font-body); font-size:15px;
    resize:vertical; letter-spacing:-0.01em;
    transition:border-color .25s ease, background .45s var(--ease-io);
  }
  .field input:focus, .field textarea:focus{ border-color:var(--accent); outline:none; }
  .field-error{ display:none; color:var(--danger); font-size:12px; margin-top:6px; }
  .field.invalid input, .field.invalid textarea{ border-color:var(--danger); }
  .field.invalid .field-error{ display:block; }
  .row2{ display:grid; grid-template-columns:2fr 1fr; gap:10px; }

  .btn-primary{
    width:100%; min-height:52px; padding:15px; border-radius:15px; border:none;
    color:var(--on-accent); font-family:var(--font-body); font-weight:700; font-size:16px;
    cursor:pointer; margin-top:4px; letter-spacing:-0.015em;
    background:linear-gradient(162deg, var(--accent-bright), var(--accent) 72%);
    box-shadow:var(--raise), 0 8px 22px var(--accent-soft);
    position:relative; overflow:hidden; -webkit-user-select:none; user-select:none;
    transition:transform .44s var(--spring), box-shadow .3s var(--ease-io);
  }
  .btn-primary::after{
    content:''; position:absolute; inset:0; pointer-events:none;
    background:var(--specular); opacity:.35; transition:opacity .28s var(--ease-io);
  }
  .btn-primary.is-pressed{ transform:scale(.98); box-shadow:var(--press); }
  .btn-primary.is-pressed::after{ opacity:.12; }
  .btn-primary:disabled{ opacity:.5; cursor:default; }
  .btn-primary .ripple{
    position:absolute; border-radius:50%; pointer-events:none; display:block; z-index:0;
    background:radial-gradient(circle, rgba(255,255,255,.4) 0%, transparent 66%);
    transform:translate(-50%,-50%) scale(0);
    animation:rippleOut .6s var(--ease-out) forwards;
  }

  .photo-pick{
    width:100%; padding:13px; border-radius:12px; cursor:pointer;
    border:1px dashed var(--hairline-strong); background:transparent; color:var(--text-faint);
    font-family:var(--font-body); font-size:14px; font-weight:600; letter-spacing:-0.01em;
    display:flex; align-items:center; justify-content:center; gap:9px;
    transition:transform .3s var(--spring), color .2s ease, border-color .2s ease;
  }
  .photo-pick:active{ transform:scale(.98); }
  .photo-pick svg{ width:19px; height:19px; }
  .photo-chosen{ position:relative; margin-top:10px; }
  .photo-chosen img{
    max-width:100%; max-height:300px; width:auto; height:auto;
    border-radius:12px; display:block; margin:0 auto; cursor:zoom-in;
    border:0.5px solid var(--hairline);
    transition:transform .34s var(--spring);
  }
  .photo-chosen img:active{ transform:scale(.985); }
  .photo-chosen button{
    position:absolute; top:8px; right:8px; width:30px; height:30px; border-radius:50%;
    border:none; background:rgba(0,0,0,.55); color:#fff; font-size:15px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .card-photo{
    max-width:100%; max-height:320px; width:auto; height:auto;
    border-radius:11px; margin:9px auto 0; display:block; cursor:zoom-in;
    border:0.5px solid var(--hairline);
    transition:transform .34s var(--spring);
  }
  .card-photo:active{ transform:scale(.985); }

  /* --- Photo en plein écran --- */
  .lightbox{
    position:fixed; inset:0; z-index:65; display:none;
    align-items:center; justify-content:center;
    padding:calc(env(safe-area-inset-top) + 58px) 18px calc(env(safe-area-inset-bottom) + 22px);
    background:var(--scrim);
    backdrop-filter:blur(16px) saturate(160%); -webkit-backdrop-filter:blur(16px) saturate(160%);
  }
  .lightbox.open{ display:flex; animation:lbFade .22s var(--ease-out); }
  @keyframes lbFade{ from{ opacity:0; } to{ opacity:1; } }
  .lightbox img{
    max-width:100%; max-height:100%; width:auto; height:auto;
    display:block; border-radius:16px; cursor:zoom-out;
    border:0.5px solid var(--hairline); box-shadow:var(--raise-lg);
    animation:lbZoom .34s var(--spring);
  }
  @keyframes lbZoom{ from{ opacity:0; transform:scale(.94); } to{ opacity:1; transform:none; } }
  .lightbox-close{
    position:absolute; top:calc(env(safe-area-inset-top) + 14px); right:16px;
    width:38px; height:38px; border-radius:12px; cursor:pointer; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; color:var(--text-muted);
    background:var(--mat-thick); border:0.5px solid var(--hairline); box-shadow:var(--raise);
    backdrop-filter:blur(18px) saturate(150%); -webkit-backdrop-filter:blur(18px) saturate(150%);
    -webkit-user-select:none; user-select:none;
    transition:transform .44s var(--spring), box-shadow .3s var(--ease-io), background .45s var(--ease-io);
  }
  .lightbox-close:active{ transform:scale(.93); box-shadow:var(--press); }

  .list{ display:flex; flex-direction:column; gap:9px; }
  .empty{ text-align:center; padding:44px 20px; color:var(--text-ghost); font-size:14px; line-height:1.6; letter-spacing:-0.01em; }
  .order-card{
    background:var(--mat); border:0.5px solid var(--hairline); border-radius:17px; padding:14px 15px;
    box-shadow:var(--raise); animation:cardIn .45s var(--ease-out) backwards;
    backdrop-filter:blur(20px) saturate(170%); -webkit-backdrop-filter:blur(20px) saturate(170%);
    transition:background .45s var(--ease-io), border-color .45s var(--ease-io);
  }
  @keyframes cardIn{ from{ opacity:0; transform:translateY(9px); } to{ opacity:1; transform:none; } }
  .card-top{ display:flex; align-items:center; justify-content:space-between; gap:9px; }
  .card-top .product{ font-weight:600; font-size:15px; letter-spacing:-0.015em; }
  .badge{ font-size:10.5px; font-weight:600; padding:3.5px 9px; border-radius:100px; white-space:nowrap; flex-shrink:0; }
  .card-mid{ font-size:13px; color:var(--text-faint); margin-top:5px; font-style:italic; letter-spacing:-0.005em; }
  .card-bottom{ margin-top:9px; font-size:12px; color:var(--text-ghost); }

  .toast{
    position:fixed; bottom:calc(env(safe-area-inset-bottom) + 22px); left:50%;
    transform:translateX(-50%) translateY(10px);
    background:var(--mat-thick); border:0.5px solid var(--hairline); color:var(--text);
    padding:12px 19px; border-radius:100px; font-size:14px; z-index:70; max-width:88vw; text-align:center;
    letter-spacing:-0.01em; box-shadow:var(--raise-lg);
    backdrop-filter:blur(22px) saturate(180%); -webkit-backdrop-filter:blur(22px) saturate(180%);
    opacity:0; transition:opacity .3s var(--ease-io), transform .35s var(--spring); pointer-events:none;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  .error-screen{ text-align:center; padding:80px 24px; }
  .error-screen .icon{ font-size:40px; margin-bottom:16px; }
  .error-screen h2{ font-family:var(--font-display); font-size:20px; margin:0 0 9px; font-weight:700; letter-spacing:-0.025em; }
  .error-screen p{ color:var(--text-faint); font-size:14.5px; line-height:1.6; margin:0; letter-spacing:-0.01em; }

  #loadingScreen{ text-align:center; padding:100px 24px; color:var(--text-ghost); font-size:14.5px; }

  /* --- Écran de code --- */
  #codeScreen{ display:none; padding:56px 8px; text-align:center; }
  #codeScreen.show{ display:block; animation:cardIn .5s var(--ease-out); }
  #codeScreen .code-icon{
    width:60px; height:60px; margin:0 auto 18px; border-radius:19px;
    background:var(--mat); border:0.5px solid var(--hairline); box-shadow:var(--raise-lg);
    display:flex; align-items:center; justify-content:center; font-size:25px;
    backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  }
  #codeScreen h2{ font-family:var(--font-display); font-size:20px; margin:0 0 7px; font-weight:700; letter-spacing:-0.025em; }
  #codeScreen p{ font-size:13.5px; color:var(--text-faint); margin:0 0 24px; line-height:1.55; letter-spacing:-0.01em; }
  .code-dots{ display:flex; gap:12px; justify-content:center; margin-bottom:26px; }
  .code-dot{
    width:13px; height:13px; border-radius:50%; border:1.5px solid var(--hairline-strong);
    transition:background .18s var(--ease-out), border-color .18s var(--ease-out), transform .3s var(--spring);
  }
  .code-dot.filled{ background:var(--accent); border-color:var(--accent); transform:scale(1.15); }
  .code-pad{ display:grid; grid-template-columns:repeat(3,1fr); gap:11px; max-width:290px; margin:0 auto; }
  .code-key{
    min-height:58px; border-radius:17px; border:0.5px solid var(--hairline); background:var(--fill);
    font-family:var(--font-display); font-size:23px; font-weight:600; color:var(--text); cursor:pointer;
    box-shadow:var(--raise); position:relative; overflow:hidden;
    -webkit-user-select:none; user-select:none;
    display:flex; align-items:center; justify-content:center;
    backdrop-filter:blur(18px) saturate(150%); -webkit-backdrop-filter:blur(18px) saturate(150%);
    transition:transform .44s var(--spring), box-shadow .3s var(--ease-io), background .45s var(--ease-io);
  }
  .code-key::after{
    content:''; position:absolute; inset:0; pointer-events:none;
    background:var(--specular); opacity:.55; transition:opacity .28s var(--ease-io);
  }
  .code-key.is-pressed{ transform:scale(.94); box-shadow:var(--press); }
  .code-key.is-pressed::after{ opacity:.18; }
  .code-key .ripple{
    position:absolute; border-radius:50%; pointer-events:none; display:block; z-index:0;
    background:radial-gradient(circle, var(--ripple) 0%, transparent 66%);
    transform:translate(-50%,-50%) scale(0);
    animation:rippleOut .6s var(--ease-out) forwards;
  }
  .code-key.fn{
    font-family:var(--font-body); font-size:13.5px; font-weight:600; color:var(--text-faint);
    background:transparent; border-color:transparent; box-shadow:none;
  }
  .code-key.fn::after{ opacity:0; }
  .code-error{ margin-top:18px; font-size:13.5px; color:var(--danger); min-height:18px; }

  .client-bio-btn{
    max-width:290px; width:100%; margin:0 auto 20px; min-height:50px; padding:14px; border-radius:15px;
    border:1.5px solid var(--accent); background:transparent; color:var(--accent);
    font-family:var(--font-body); font-weight:600; font-size:15px; cursor:pointer;
    display:none; align-items:center; justify-content:center; gap:10px; letter-spacing:-0.015em;
    position:relative; overflow:hidden; transition:transform .44s var(--spring);
  }
  .client-bio-btn.show{ display:flex; }
  .client-bio-btn.is-pressed{ transform:scale(.98); }
  .client-bio-btn svg{ width:20px; height:20px; position:relative; z-index:1; }
  .bio-enable-link{
    display:none; margin:18px auto 0; background:none; border:none; color:var(--text-faint);
    font-family:var(--font-body); font-size:13px; cursor:pointer; text-decoration:underline;
    letter-spacing:-0.01em;
  }
  .bio-enable-link.show{ display:block; }

  .shake{ animation:shakeX .4s var(--ease-out); }
  @keyframes shakeX{ 0%,100%{transform:translateX(0);} 20%{transform:translateX(-9px);} 40%{transform:translateX(9px);} 60%{transform:translateX(-6px);} 80%{transform:translateX(6px);} }

  .theme-toggle{
    position:fixed; top:calc(env(safe-area-inset-top) + 16px); right:16px; z-index:60;
    width:38px; height:38px; border-radius:12px; cursor:pointer; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; color:var(--text-muted);
    background:var(--fill); border:0.5px solid var(--hairline); box-shadow:var(--raise);
    backdrop-filter:blur(18px) saturate(150%); -webkit-backdrop-filter:blur(18px) saturate(150%);
    position:fixed; overflow:hidden; -webkit-user-select:none; user-select:none;
    transition:transform .44s var(--spring), box-shadow .3s var(--ease-io), background .45s var(--ease-io);
  }
  .theme-toggle.is-pressed{ transform:scale(.93); box-shadow:var(--press); }
  .theme-toggle svg{ width:17px; height:17px; position:relative; z-index:1; }

  @media (max-width:640px){
    #app{ padding-left:15px; padding-right:15px; }
    header h1{ font-size:23px; }
    .row2{ grid-template-columns:1fr; }
    .code-pad{ max-width:270px; }
  }
  @media (min-width:700px){ #app{ max-width:600px; } }
  @media (prefers-reduced-motion:reduce){
    *{ animation-duration:.01ms !important; transition-duration:.01ms !important; }
  }
</style>
</head>
<body style="background:#fbfcfa;">
<div id="bgfill"></div>
<button class="theme-toggle" id="themeToggle" title="Thème"><svg class="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></svg></button>
<div id="app" style="display:none;">
  <header>
    <div class="brand">DOLLAR$ SOURCING</div>
    <h1 id="greeting">Bonjour</h1>

<script>
// ==== Même projet Firebase que l'app pro ====
const firebaseConfig = {
  apiKey: "AIzaSyC8O6YqLkxmNoPtTGXm0d25IEyqvB8PZfg",
  authDomain: "dollar-sourcing.firebaseapp.com",
  projectId: "dollar-sourcing",

  appId: "1:1023577527754:web:74d55f10bb11807ec4eb33"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const $ = (sel)=>document.querySelector(sel);

// ================= Thème clair / sombre =================
const THEME_ICONS = {
  sun:  '<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.1 5.1l1.6 1.6M17.3 17.3l1.6 1.6M18.9 5.1l-1.6 1.6M6.7 17.3l-1.6 1.6"/>',
  moon: '<path d="M20 14.6A8.6 8.6 0 1 1 9.4 4a6.9 6.9 0 0 0 10.6 10.6z"/>'
};
function autoTheme(){
  const h = new Date().getHours();
  return (h >= 7 && h < 19) ? 'light' : 'dark';
}
function applyTheme(theme){
  document.documentElement.setAttribute('data-theme', theme);
  const meta = document.querySelector('meta[name="color-scheme"]');
  if(meta) meta.setAttribute('content', 'only ' + theme);
  const bg = theme === 'light' ? '#fbfcfa' : '#0a0a0b';
  document.documentElement.style.background = bg;
  document.body.style.background = bg;
  const tc = document.querySelector('meta[name="theme-color"]');
  if(tc) tc.setAttribute('content', bg);
  const svg = theme === 'light' ? THEME_ICONS.moon : THEME_ICONS.sun;
  document.querySelectorAll('.theme-icon').forEach(el => el.innerHTML = svg);
}
let savedTheme = null;
try{ savedTheme = localStorage.getItem('ds_theme'); }catch(e){}
let currentTheme = savedTheme || autoTheme();
applyTheme(currentTheme);
document.getElementById('themeToggle').addEventListener('click', ()=>{
  currentTheme = (currentTheme === 'light') ? 'dark' : 'light';
  applyTheme(currentTheme);
  try{ localStorage.setItem('ds_theme', currentTheme); }catch(e){}
});

// ================= Photo en plein écran =================
const lightbox = $('#lightbox');
const lightboxImg = $('#lightboxImg');
function openLightbox(src){
  if(!src) return;
  lightboxImg.src = src;
  lightbox.classList.add('open');
}
function closeLightbox(){
  if(!lightbox.classList.contains('open')) return;
  lightbox.classList.remove('open');
  lightboxImg.removeAttribute('src');
}
document.addEventListener('click', (e)=>{
  const img = e.target.closest && e.target.closest('.card-photo, .photo-chosen img');
  if(!img) return;
  e.preventDefault();
  e.stopPropagation();
  openLightbox(img.src);
}, true);
lightbox.addEventListener('click', closeLightbox);
document.addEventListener('keydown', (e)=>{ if(e.key === 'Escape') closeLightbox(); });

// ================= Effet tactile (liquid glass) =================
const TAP_SELECTOR = '.tab, .code-key, .btn-primary, .client-bio-btn, .theme-toggle';
const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function tapDown(el, cx, cy){
  el.classList.add('is-pressed');
  if(prefersReduced) return;
  const rect = el.getBoundingClientRect();
  const x = (cx == null ? rect.left + rect.width/2 : cx) - rect.left;
  const y = (cy == null ? rect.top + rect.height/2 : cy) - rect.top;
  const reach = Math.max(rect.width, rect.height) * 2.1;
  const r = document.createElement('i');
  r.className = 'ripple';
  r.style.cssText = 'width:' + reach + 'px;height:' + reach + 'px;left:' + x + 'px;top:' + y + 'px;';
  el.appendChild(r);
  setTimeout(()=>r.remove(), 620);
}
function tapReleaseAll(){
  document.querySelectorAll('.is-pressed').forEach(el => el.classList.remove('is-pressed'));
}
document.addEventListener('pointerdown', (e)=>{
  const el = e.target.closest(TAP_SELECTOR);
  if(!el || el.disabled) return;
  tapDown(el, e.clientX, e.clientY);
  if(navigator.vibrate) navigator.vibrate(7);
}, { passive:true });
['pointerup','pointercancel'].forEach(evt=>{
  document.addEventListener(evt, tapReleaseAll, { passive:true });
});
document.addEventListener('pointermove', (e)=>{
  const pressed = document.querySelector('.is-pressed');
  if(!pressed) return;
  if(e.target.closest(TAP_SELECTOR) !== pressed) tapReleaseAll();
}, { passive:true });
document.addEventListener('keyup', tapReleaseAll);

const STATUS_META = {
  nouveau:{ label:'Nouvelle demande', color:'var(--st-nouveau)' },
  devis:{ label:'Devis envoyé', color:'var(--st-devis)' },
  paye:{ label:'Payé', color:'var(--st-paye)' },
  commande:{ label:'Commandé usine', color:'var(--st-commande)' },
  expedie:{ label:'Expédié', color:'var(--st-expedie)' },
  livre:{ label:'Livré', color:'var(--st-livre)' },
  annule:{ label:'Annulé', color:'var(--st-annule)' }
};

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtDate(ts){
  if(!ts) return '';
  const diffDays = Math.floor((Date.now()-ts)/86400000);
  if(diffDays===0) return "aujourd'hui";
  if(diffDays===1) return 'hier';
  if(diffDays<7) return `il y a ${diffDays}j`;
  return new Date(ts).toLocaleDateString('fr-FR', {day:'2-digit', month:'2-digit'});
}
function showToast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2600);
}
function setFieldError(input, message){
  const field = input.closest('.field');
  field.classList.add('invalid');
  let err = field.querySelector('.field-error');
  err.textContent = message;
}
function clearFormErrors(){
  document.querySelectorAll('.field.invalid').forEach(f=>f.classList.remove('invalid'));
}

// ---- Lecture du lien (?id=...&token=...) ----
const params = new URLSearchParams(location.search);
const clientId = params.get('id');
const clientToken = params.get('token');

let clientData = null;
let ordersUnsub = null;
let pendingUnsub = null;
let myOrders = [];
let myPending = [];

function showError(title, text){
  $('#loadingScreen').innerHTML = `
    <div class="error-screen">
      <div class="icon">🔒</div>
      <h2>${escapeHtml(title)}</h2>
      <p>${escapeHtml(text)}</p>
    </div>`;
}

function bioKey(){ return 'ds_client_bio_' + clientId; }
function bioAvailable(){
  return !!(window.PublicKeyCredential && navigator.credentials && location.protocol === 'https:');
}
function bioRegistered(){
  try{ return !!localStorage.getItem(bioKey()); }catch(e){ return false; }
}

async function registerClientBio(){
  if(!bioAvailable()){ codeError('Non disponible sur cet appareil.'); return; }
  try{
    const challenge = crypto.getRandomValues(new Uint8Array(32));
    const userId = crypto.getRandomValues(new Uint8Array(16));
    const cred = await navigator.credentials.create({
      publicKey: {
        challenge,
        rp: { name: 'DOLLAR$ SOURCING' },
        user: { id: userId, name: clientData.name || 'client', displayName: clientData.name || 'Client' },
        pubKeyCredParams: [{type:'public-key', alg:-7},{type:'public-key', alg:-257}],
        authenticatorSelection: { authenticatorAttachment:'platform', userVerification:'required' },
        timeout: 60000,
        attestation: 'none'
      }
    });
    if(!cred){ return; }
    const rawId = btoa(String.fromCharCode(...new Uint8Array(cred.rawId)));
    localStorage.setItem(bioKey(), rawId);
    codeError('');
    enterApp();
  }catch(e){
    codeError('Activation impossible sur cet appareil.');
  }
}

async function verifyClientBio(){
  const stored = (()=>{ try{ return localStorage.getItem(bioKey()); }catch(e){ return null; } })();
  if(!stored) return;
  try{
    const rawId = Uint8Array.from(atob(stored), c=>c.charCodeAt(0));
    const challenge = crypto.getRandomValues(new Uint8Array(32));
    const assertion = await navigator.credentials.get({
      publicKey: {
        challenge,
        allowCredentials: [{ type:'public-key', id: rawId }],
        userVerification: 'required',
        timeout: 60000
      }
    });
    if(assertion){ enterApp(); }
    else codeError('Utilise ton code.');
  }catch(e){
    codeError('Vérification échouée, utilise ton code.');
  }
}

document.getElementById('clientBioBtn').addEventListener('click', verifyClientBio);
document.getElementById('clientBioEnable').addEventListener('click', registerClientBio);

const CODE_LENGTH = 6;
let codeBuffer = '';
let codeAttempts = 0;

function renderCodeDots(){
  document.getElementById('codeDots').innerHTML =
    Array.from({length:CODE_LENGTH}, (_,i)=>
      `<div class="code-dot ${i < codeBuffer.length ? 'filled' : ''}"></div>`).join('');
}
function buildCodePad(){
  const keys = ['1','2','3','4','5','6','7','8','9','clear','0','back'];
  document.getElementById('codePad').innerHTML = keys.map(k=>{
    if(k==='clear') return `<button type="button" class="code-key fn" data-key="clear">Effacer</button>`;
    if(k==='back')  return `<button type="button" class="code-key fn" data-key="back">⌫</button>`;
    return `<button type="button" class="code-key" data-key="${k}">${k}</button>`;
  }).join('');
}
function codeError(msg){
  const el = document.getElementById('codeError');
  el.textContent = msg || '';
  if(msg){
    const s = document.getElementById('codeScreen');
    s.classList.remove('shake'); void s.offsetWidth; s.classList.add('shake');
  }
}
function enterApp(){
  document.getElementById('codeScreen').classList.remove('show');
  $('#greeting').textContent = 'Bonjour ' + clientData.name;
  $('#loadingScreen').style.display = 'none';
  $('#app').style.display = 'block';
  listenOrders();
}
function askCode(){
  $('#loadingScreen').style.display = 'none';
  buildCodePad();
  codeBuffer = '';
  renderCodeDots();
  document.getElementById('codeScreen').classList.add('show');
}

document.addEventListener('click', (e)=>{
  const btn = e.target.closest('#codePad button[data-key]');
  if(!btn) return;
  const k = btn.dataset.key;
  if(k==='clear'){ codeBuffer=''; renderCodeDots(); codeError(''); return; }
  if(k==='back'){ codeBuffer = codeBuffer.slice(0,-1); renderCodeDots(); codeError(''); return; }
  if(codeBuffer.length >= CODE_LENGTH) return;
  codeBuffer += k;
  codeError('');
  renderCodeDots();
  if(codeBuffer.length === CODE_LENGTH){
    if(codeBuffer === String(clientData.accessCode)){
      if(bioAvailable() && !bioRegistered()){
        codeBuffer = '';
        renderCodeDots();
        document.getElementById('codeTitle').textContent = 'Code validé';
        document.getElementById('codeSubtitle').textContent = 'Active Face ID pour ne plus avoir à saisir ton code.';
        document.getElementById('codePad').style.display = 'none';
        document.getElementById('codeDots').style.display = 'none';
        document.getElementById('clientBioEnable').textContent = 'Activer Face ID sur cet appareil';
        document.getElementById('clientBioEnable').classList.add('show');
        const skip = document.createElement('button');
        skip.type = 'button';
        skip.className = 'bio-enable-link show';
        skip.textContent = 'Plus tard';
        skip.addEventListener('click', enterApp);
        document.getElementById('codeScreen').appendChild(skip);
        return;
      }
      enterApp();
    } else {
      codeAttempts++;
      codeBuffer = '';
      renderCodeDots();
      codeError(codeAttempts >= 5
        ? 'Trop de tentatives. Contacte ton vendeur.'
        : 'Code incorrect. Réessaie.');
      if(codeAttempts >= 5){
        document.getElementById('codePad').style.pointerEvents = 'none';
        document.getElementById('codePad').style.opacity = '0.4';
      }
    }
  }
});

async function init(){
  if(!clientId || !clientToken){
    showError('Lien invalide', "Ce lien n'est pas complet. Demande un nouveau lien à ton vendeur.");
    return;
  }
  try{
    const doc = await db.collection('clients').doc(clientId).get();
    if(!doc.exists || doc.data().token !== clientToken){
      showError('Lien invalide ou expiré', 'Ce lien ne correspond à aucun compte actif. Demande un nouveau lien à ton vendeur.');
      return;
    }
    clientData = Object.assign({id:doc.id}, doc.data());

    if(!clientData.accessCode){ enterApp(); return; }

    askCode();
    if(bioAvailable() && bioRegistered()){
      document.getElementById('codeTitle').textContent = 'Déverrouiller';
      document.getElementById('codeSubtitle').textContent = 'Utilise Face ID, ou saisis ton code.';
      document.getElementById('clientBioBtn').classList.add('show');
      setTimeout(verifyClientBio, 350);
    }
  }catch(e){
    showError('Connexion impossible', 'Vérifie ta connexion internet et réessaie.');
  }
}

function listenOrders(){
  ordersUnsub = db.collection('orders').where('clientId','==',clientId).onSnapshot(snap=>{
    myOrders = snap.docs.map(d=>Object.assign({id:d.id}, d.data())).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    renderHistory();
  });
  pendingUnsub = db.collection('pendingOrders').where('clientId','==',clientId).onSnapshot(snap=>{
    myPending = snap.docs.map(d=>Object.assign({id:d.id}, d.data())).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    renderHistory();
  });
}

function renderHistory(){
  const el = $('#historyList');
  const pendingCards = myPending.map(p=>`
    <div class="order-card">
      <div class="card-top">
        <div class="product">${escapeHtml(p.product)} × ${p.qty}</div>
        <div class="badge" style="background:color-mix(in srgb, var(--st-attente) 18%, white); color:var(--st-attente);">En attente de validation</div>
      </div>
      ${p.note ? `<div class="card-mid">"${escapeHtml(p.note)}"</div>` : ''}
      ${p.photo ? `<img class="card-photo" src="data:${p.photoType||'image/jpeg'};base64,${p.photo}" alt="" title="Voir la photo en plein écran" aria-label="Voir la photo en plein écran">` : ''}
      <div class="card-bottom">${fmtDate(p.createdAt)}</div>
    </div>`).join('');
  const orderCards = myOrders.map(o=>{
    const meta = STATUS_META[o.status] || STATUS_META.nouveau;
    return `
    <div class="order-card">
      <div class="card-top">
        <div class="product">${escapeHtml(o.product)} × ${o.qty}</div>
        <div class="badge" style="background:color-mix(in srgb, ${meta.color} 18%, white); color:${meta.color};">${meta.label}</div>
      </div>
      ${o.note ? `<div class="card-mid">${escapeHtml(o.note)}</div>` : ''}
      <div class="card-bottom">${fmtDate(o.createdAt)}</div>
    </div>`;
  }).join('');
  const html = pendingCards + orderCards;
  el.innerHTML = html || `<div class="empty">Tu n'as pas encore de commande.<br>Utilise l'onglet "Nouvelle commande" pour en envoyer une.</div>`;
}

// ---- Photo du produit ----
let orderPhoto = null;   // { media_type, data, url }

function compressImage(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const MAX = 900;                     // suffisant pour identifier un produit
        let { width, height } = img;
        if(width > MAX || height > MAX){
          const ratio = Math.min(MAX / width, MAX / height);
          width = Math.round(width * ratio);
          height = Math.round(height * ratio);
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        let quality = 0.7;
        let dataUrl = canvas.toDataURL('image/jpeg', quality);
        // on descend la qualité tant que l'image dépasse ~450 Ko
        while(dataUrl.length > 600000 && quality > 0.35){
          quality -= 0.1;
          dataUrl = canvas.toDataURL('image/jpeg', quality);
        }
        resolve({ media_type:'image/jpeg', data:dataUrl.split(',')[1], url:dataUrl });
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

$('#photoPick').addEventListener('click', ()=> $('#photoInput').click());
$('#photoClear').addEventListener('click', ()=>{
  orderPhoto = null;
  $('#photoChosen').style.display = 'none';
  $('#photoThumb').removeAttribute('src');
  $('#photoInput').value = '';
  $('#photoPickLabel').textContent = 'Ajouter une photo';
});
$('#photoInput').addEventListener('change', async (e)=>{
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  $('#photoPickLabel').textContent = 'Préparation...';
  try{
    const img = await compressImage(file);
    if(img.data.length > 700000){
      showToast('Photo trop lourde, essaie une image plus légère.');
      $('#photoPickLabel').textContent = 'Ajouter une photo';
      return;
    }
    orderPhoto = img;
    $('#photoThumb').src = img.url;
    $('#photoChosen').style.display = 'block';
    $('#photoPickLabel').textContent = 'Changer la photo';
  }catch(err){
    showToast("Impossible de lire cette image.");
    $('#photoPickLabel').textContent = 'Ajouter une photo';
  }
});

// ---- Tabs ----
$('#tabOrder').addEventListener('click', ()=>{
  $('#tabOrder').classList.add('active'); $('#tabHistory').classList.remove('active');
  $('#orderPanel').style.display='block'; $('#historyPanel').style.display='none';
});
$('#tabHistory').addEventListener('click', ()=>{
  $('#tabHistory').classList.add('active'); $('#tabOrder').classList.remove('active');
  $('#historyPanel').style.display='block'; $('#orderPanel').style.display='none';
});

// ---- Envoi de la demande ----
$('#orderForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  clearFormErrors();
  let valid = true;

  const product = $('#f_product').value.trim();
  if(!product){ setFieldError($('#f_product'), 'Indique un produit'); valid = false; }

  const qtyVal = parseInt($('#f_qty').value);
  if(!qtyVal || qtyVal<1){ setFieldError($('#f_qty'), 'Quantité invalide'); valid = false; }

  if(!valid) return;

  const submitBtn = $('#submitBtn');
  submitBtn.disabled = true;
  submitBtn.textContent = 'Envoi...';
  try{
    const payload = {
      clientId: clientId,
      clientName: clientData.name,
      token: clientToken,
      ownerId: clientData.ownerId || null,   // la demande revient au vendeur de ce client
      product,
      qty: qtyVal,
      note: $('#f_note').value.trim(),
      createdAt: Date.now()
    };
    if(orderPhoto){
      payload.photo = orderPhoto.data;
      payload.photoType = orderPhoto.media_type;
    }
    await db.collection('pendingOrders').add(payload);
    $('#orderForm').reset();
    $('#f_qty').value = 1;
    orderPhoto = null;
    $('#photoChosen').style.display = 'none';
    $('#photoThumb').removeAttribute('src');
    $('#photoPickLabel').textContent = 'Ajouter une photo';
    showToast('Commande envoyée ! Ton vendeur va la valider.');
  }catch(e){
    showToast("Erreur d'envoi, réessaie.");
  }
  submitBtn.disabled = false;
  submitBtn.textContent = 'Envoyer ma commande';
});

init();
</script>

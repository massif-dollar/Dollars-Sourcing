<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="color-scheme" content="only light">
<meta name="theme-color" content="#ffffff">
<title>DOLLAR$ SOURCING</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme:light;
    --bg:#f0f0f2;
    --glass:rgba(255,255,255,0.65);
    --glass-strong:rgba(255,255,255,0.85);
    --glass-border:rgba(0,0,0,0.08);
    --glass-shadow:0 10px 26px rgba(0,0,0,0.07);
    --glass-highlight:inset 0 1px 0 rgba(255,255,255,0.85);
    --text:#1a1a1c;
    --text-muted:#6b6b70;
    --text-faint:#9a9aa0;
    --gold:#000000;
    --teal:#d3283a;
    --danger:#d3283a;
    --radius:20px;
    --radius-sm:13px;
    --font-display:'Space Grotesk',sans-serif;
    --font-body:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;

    --st-nouveau:#b0b0b6;
    --st-devis:#8a8a91;
    --st-paye:#1a1a1c;
    --st-commande:#6b6b72;
    --st-expedie:#4a4a50;
    --st-livre:#2a2a2e;
    --st-annule:#d3283a;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    min-height:100vh;
    position:relative;
    overflow-x:hidden;
  }
  body::before{
    content:'';
    position:fixed; inset:0;
    background:
      radial-gradient(circle at 15% -5%, rgba(20,20,22,0.05), transparent 42%),
      radial-gradient(circle at 90% 100%, rgba(211,40,58,0.12), transparent 45%);
    pointer-events:none;
    z-index:0;
  }
  #app{
    position:relative; z-index:1;
    max-width:560px; margin:0 auto;
    padding:22px 16px 110px;
  }
  :focus-visible{ outline:2px solid var(--teal); outline-offset:2px; }

  header{ display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:18px; }
  header h1{ font-family:var(--font-display); font-size:22px; font-weight:600; margin:0; letter-spacing:-0.01em; }
  header p{ margin:4px 0 0; font-size:13px; color:var(--text-muted); }
  .icon-btn{
    background:var(--glass); border:1px solid var(--glass-border); color:var(--text-muted);
    width:36px; height:36px; border-radius:11px; font-size:16px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .icon-btn:hover{ color:var(--text); }

  .kpis{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px; }
  .kpi{
    background:var(--glass); border:1px solid var(--glass-border); border-radius:var(--radius-sm);
    padding:13px 14px; backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    box-shadow:var(--glass-shadow), var(--glass-highlight);
  }
  .kpi .label{ font-size:11px; text-transform:uppercase; letter-spacing:0.06em; color:var(--text-faint); }
  .kpi .value{ font-family:var(--font-display); font-size:21px; font-weight:600; margin-top:4px; }
  .kpi.money .value{ color:var(--gold); }
  .kpi.pending.active .value{ animation:pulseGold 2.2s ease-in-out infinite; }
  @keyframes pulseGold{ 0%,100%{ opacity:1; } 50%{ opacity:0.55; } }

  .search{ position:relative; margin-bottom:12px; }
  .search input{
    width:100%; background:var(--glass); border:1px solid var(--glass-border); color:var(--text);
    border-radius:var(--radius-sm); padding:11px 14px; font-family:var(--font-body); font-size:14px;
  }
  .search input::placeholder{ color:var(--text-faint); }

  .tabs{ display:flex; gap:7px; overflow-x:auto; padding-bottom:4px; margin-bottom:14px; scrollbar-width:none; }
  .tabs::-webkit-scrollbar{ display:none; }
  .tab{
    flex-shrink:0; padding:7px 13px; border-radius:100px; font-size:12.5px; font-weight:500;
    background:var(--glass); border:1px solid var(--glass-border); color:var(--text-muted); cursor:pointer;
    white-space:nowrap;
  }
  .tab.active{ background:var(--teal); border-color:var(--teal); color:#ffffff; font-weight:600; }

  .list{ display:flex; flex-direction:column; gap:9px; }
  .empty{
    text-align:center; padding:50px 20px; color:var(--text-faint); font-size:13.5px; line-height:1.6;
  }
  .order-card{
    background:var(--glass); border:1px solid var(--glass-border); border-radius:16px; padding:13px 14px;
    cursor:pointer; transition:background 0.15s;
    box-shadow:var(--glass-shadow), var(--glass-highlight);
  }
  .order-card:hover{ background:var(--glass-strong); }
  .card-top{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .card-top .client{ font-weight:600; font-size:14.5px; }
  .badge{
    font-size:10.5px; font-weight:600; padding:3px 9px; border-radius:100px; white-space:nowrap; flex-shrink:0;
  }
  .card-mid{ font-size:12.5px; color:var(--text-muted); margin-top:4px; }
  .card-bottom{ display:flex; align-items:center; justify-content:space-between; margin-top:8px; }
  .card-bottom .date{ font-size:11.5px; color:var(--text-faint); }
  .margin{ font-family:var(--font-display); font-weight:600; font-size:14px; }
  .margin.pos{ color:var(--gold); }
  .margin.neg{ color:var(--danger); }
  .mult{ opacity:.6; font-weight:500; font-family:var(--font-body); font-size:12px; }

  .view-switch{ display:flex; gap:8px; margin-bottom:16px; overflow-x:auto; scrollbar-width:none; }
  .view-switch::-webkit-scrollbar{ display:none; }
  .view-switch button{
    flex-shrink:0; padding:9px 14px; border-radius:13px; border:1px solid var(--glass-border); background:var(--glass);
    color:var(--text-muted); font-family:var(--font-body); font-weight:600; font-size:13px; cursor:pointer; white-space:nowrap;
  }
  .view-switch button.active{ background:var(--glass-strong); color:var(--text); border-color:var(--teal); }

  .chart-wrap{
    background:var(--glass); border:1px solid var(--glass-border); border-radius:var(--radius-sm);
    padding:14px 10px 8px; margin-bottom:14px;
    box-shadow:var(--glass-shadow), var(--glass-highlight);
  }
  .chart-legend{ display:flex; gap:16px; justify-content:center; margin-top:4px; }
  .chart-legend span{ font-size:11.5px; color:var(--text-muted); display:flex; align-items:center; gap:6px; }
  .legend-dot{ width:8px; height:8px; border-radius:50%; display:inline-block; }

  .fab{
    position:fixed; right:20px; bottom:26px; width:56px; height:56px; border-radius:18px;
    background:linear-gradient(135deg,#e8495a,var(--teal)); border:none; color:#ffffff;
    font-size:26px; font-weight:600; cursor:pointer; z-index:20;
    box-shadow:0 8px 24px rgba(211,40,58,0.35); display:flex; align-items:center; justify-content:center;
  }

  .overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.55); backdrop-filter:blur(4px);
    z-index:30; display:none; align-items:flex-end; justify-content:center;
  }
  .overlay.open{ display:flex; }
  .sheet{
    width:100%; max-width:560px; max-height:88vh; overflow-y:auto;
    background:#fbfaf7; border:1px solid var(--glass-border); border-bottom:none;
    border-radius:22px 22px 0 0; padding:20px 18px 26px; position:relative;
    animation:slideUp 0.22s ease-out;
    box-shadow:0 -14px 34px rgba(20,20,30,0.10);
  }
  @keyframes slideUp{ from{ transform:translateY(100%); } to{ transform:translateY(0); } }
  .sheet h2{ font-family:var(--font-display); font-size:18px; margin:0 0 16px; }
  .field{ margin-bottom:13px; }
  .field label{ display:block; font-size:12px; color:var(--text-muted); margin-bottom:5px; }
  .field input, .field select, .field textarea{
    width:100%; background:var(--glass); border:1px solid var(--glass-border); color:var(--text);
    border-radius:11px; padding:10px 12px; font-family:var(--font-body); font-size:14px; resize:vertical;
  }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .margin-preview{
    text-align:center; padding:10px; border-radius:12px; background:var(--glass); margin:14px 0;
    font-size:13px; line-height:1.7;
  }
  .status-stepper{ display:flex; align-items:center; justify-content:center; gap:14px; margin:16px 0; }
  .stepper-btn{
    width:34px; height:34px; border-radius:10px; border:1px solid var(--glass-border); background:var(--glass);
    color:var(--text); font-size:16px; cursor:pointer;
  }
  .stepper-btn:disabled{ opacity:0.3; cursor:default; }
  .status-label{ font-size:13px; font-weight:600; min-width:130px; text-align:center; padding:6px 0; }
  .btn-primary{
    width:100%; padding:13px; border-radius:13px; border:none; background:var(--teal); color:#ffffff;
    font-weight:700; font-size:14.5px; cursor:pointer; margin-top:4px;
  }
  .btn-row{ display:flex; gap:10px; margin-top:10px; }
  .btn-secondary{
    flex:1; padding:11px; border-radius:13px; border:1px solid var(--glass-border); background:transparent;
    color:var(--danger); font-weight:600; font-size:13px; cursor:pointer;
  }
  .close-x{ position:absolute; top:16px; right:16px; }
  .section-title{ font-size:15px; font-weight:600; margin:0; }

  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:#232428; border:1px solid rgba(255,255,255,0.1); color:#f2f1ec;
    padding:10px 16px; border-radius:100px; font-size:13px; z-index:50;
    opacity:0; transition:opacity 0.25s; pointer-events:none;
  }
  .toast.show{ opacity:1; }

  #splash{
    position:fixed; inset:0; z-index:100;
    display:flex; align-items:center; justify-content:center;
    background:var(--bg);
    transition:opacity 0.5s ease, transform 0.5s ease;
  }
  #splash::before{
    content:'';
    position:absolute; inset:0;
    background:
      radial-gradient(circle at 20% 15%, rgba(20,20,22,0.06), transparent 45%),
      radial-gradient(circle at 85% 85%, rgba(211,40,58,0.14), transparent 45%);
  }
  #splash.hide{ opacity:0; transform:scale(1.04); pointer-events:none; }
  .splash-inner{ position:relative; text-align:center; animation:splashIn 0.7s ease; }
  @keyframes splashIn{ from{ opacity:0; transform:translateY(8px) scale(0.97); } to{ opacity:1; transform:translateY(0) scale(1); } }
  .splash-icon{
    width:64px; height:64px; margin:0 auto 16px; border-radius:20px;
    background:var(--glass); box-shadow:var(--glass-shadow), var(--glass-highlight);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display); font-size:30px; font-weight:700; color:var(--teal);
  }
  .splash-inner h1{
    font-family:var(--font-display); font-size:25px; font-weight:700; margin:0;
    letter-spacing:-0.01em; color:var(--text);
  }
  .splash-inner p{ margin:6px 0 0; font-size:13px; color:var(--text-muted); }

  @media (prefers-reduced-motion:reduce){
    *{ animation:none !important; transition:none !important; }
  }
</style>
</head>
<body>
<div id="splash">
  <div class="splash-inner">
    <div class="splash-icon">$</div>
    <h1>DOLLAR$ SOURCING</h1>
    <p>Sourcing &amp; revente</p>
  </div>
</div>
<div id="app">
  <header>
    <div>
      <h1>DOLLAR$ SOURCING</h1>
      <p>Sourcing &amp; revente</p>
    </div>
    <button class="icon-btn" id="resetBtn" title="Réinitialiser">⟲</button>
  </header>

  <div class="view-switch">
    <button id="viewBtnCommandes" class="active">📋 Commandes</button>
    <button id="viewBtnClients">👤 Clients</button>
    <button id="viewBtnSuppliers">🏭 Fournisseurs</button>
    <button id="viewBtnStats">📊 Stats</button>
  </div>

  <div id="commandesView">
    <div class="kpis">
      <div class="kpi"><div class="label">En cours</div><div class="value" id="kpiActive">0</div></div>
      <div class="kpi money"><div class="label">Marge totale</div><div class="value" id="kpiMargin">0€</div></div>
      <div class="kpi money pending" id="kpiPendingCard"><div class="label">À encaisser</div><div class="value" id="kpiPending">0€</div></div>
      <div class="kpi"><div class="label">Livrées</div><div class="value" id="kpiDelivered">0</div></div>
    </div>
    <div class="search">
      <input type="text" id="searchInput" placeholder="Rechercher un client ou un produit...">
    </div>
    <div class="tabs" id="tabs"></div>
    <div class="list" id="list"></div>
  </div>

  <div id="clientsView" style="display:none;">
    <div class="search"><input type="text" id="clientSearchInput" placeholder="Rechercher un client..."></div>
    <div class="list" id="clientList"></div>
  </div>

  <div id="suppliersView" style="display:none;">
    <div class="search"><input type="text" id="supplierSearchInput" placeholder="Rechercher un fournisseur..."></div>
    <div class="list" id="supplierList"></div>
  </div>

  <div id="statsView" style="display:none;">
    <div class="tabs" id="rangeTabs"></div>
    <div class="kpis">
      <div class="kpi money"><div class="label">CA (période)</div><div class="value" id="statRevenue">0€</div></div>
      <div class="kpi money"><div class="label">Marge (période)</div><div class="value" id="statMargin">0€</div></div>
      <div class="kpi"><div class="label">Panier moyen</div><div class="value" id="statAvg">0€</div></div>
      <div class="kpi"><div class="label">Marge moyenne</div><div class="value" id="statPct">0%</div></div>
    </div>
    <div class="chart-wrap">
      <div id="chartContainer"></div>
      <div class="chart-legend">
        <span><i class="legend-dot" style="background:#8a8a91;"></i>Revenu</span>
        <span><i class="legend-dot" style="background:var(--gold);"></i>Marge</span>
      </div>
    </div>
  </div>
</div>

<button class="fab" id="fabAdd" title="Ajouter">+</button>

<div class="overlay" id="overlay">
  <div class="sheet">
    <button class="icon-btn close-x" id="closeSheet">✕</button>
    <h2 id="sheetTitle">Nouvelle commande</h2>
    <form id="orderForm">
      <div class="field">
        <label>Client</label>
        <select id="f_clientSelect" required></select>
      </div>
      <div id="newClientFields" style="display:none;">
        <div class="field">
          <label>Nom du nouveau client</label>
          <input type="text" id="f_newClientName" placeholder="Nom">
        </div>
        <div class="field">
          <label>Contact (réseau, tél...)</label>
          <input type="text" id="f_newClientContact" placeholder="@pseudo TikTok, Snap, tél...">
        </div>
        <div class="field">
          <label>Adresse de livraison</label>
          <input type="text" id="f_newClientAddress" placeholder="Optionnel">
        </div>
      </div>

      <div class="field">
        <label>Produit</label>
        <input type="text" id="f_product" required placeholder="Ex: paire de chaussures">
      </div>
      <div class="row2">
        <div class="field">
          <label>Quantité</label>
          <input type="number" id="f_qty" min="1" value="1" required>
        </div>
        <div class="field">
          <label>Statut</label>
          <select id="f_status"></select>
        </div>
      </div>
      <div class="row2">
        <div class="field">
          <label>Prix usine / unité (€)</label>
          <input type="number" id="f_unitCost" min="0" step="0.01" required>
        </div>
        <div class="field">
          <label>Prix client / unité (€)</label>
          <input type="number" id="f_unitPrice" min="0" step="0.01" required>
        </div>
      </div>
      <div class="margin-preview" id="marginPreview">Marge : 0€</div>
      <div class="field">
        <label>Note (n° de suivi, précisions...)</label>
        <textarea id="f_note" rows="2"></textarea>
      </div>

      <div id="stepperZone" style="display:none;">
        <div class="status-stepper">
          <button type="button" class="stepper-btn" id="stepPrev">←</button>
          <div class="status-label" id="stepLabel"></div>
          <button type="button" class="stepper-btn" id="stepNext">→</button>
        </div>
      </div>

      <button type="submit" class="btn-primary" id="saveBtn">Enregistrer</button>
      <div class="btn-row" id="editActions" style="display:none;">
        <button type="button" class="btn-secondary" id="cancelOrderBtn">Annuler la commande</button>
        <button type="button" class="btn-secondary" id="deleteBtn">Supprimer</button>
      </div>
    </form>
  </div>
</div>

<div class="overlay" id="clientOverlay">
  <div class="sheet">
    <button class="icon-btn close-x" id="closeClientSheet">✕</button>
    <h2 id="clientSheetTitle">Profil client</h2>
    <form id="clientForm">
      <div class="field"><label>Nom</label><input type="text" id="c_name" required></div>
      <div class="field"><label>Contact</label><input type="text" id="c_contact" placeholder="@pseudo, tél..."></div>
      <div class="field"><label>Adresse de livraison</label><input type="text" id="c_address"></div>
      <button type="submit" class="btn-primary">Enregistrer</button>
    </form>
    <div id="clientOrdersSection" style="margin-top:18px;">
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;">
        <h2 class="section-title">Commandes</h2>
        <button type="button" class="btn-secondary" id="addOrderForClient" style="flex:none; color:var(--teal); border-color:var(--teal);">+ Commande</button>
      </div>
      <div id="clientOrdersList"></div>
    </div>
    <div class="btn-row" style="margin-top:16px;">
      <button type="button" class="btn-secondary" id="deleteClientBtn">Supprimer ce client</button>
    </div>
  </div>
</div>

<div class="overlay" id="supplierOverlay">
  <div class="sheet">
    <button class="icon-btn close-x" id="closeSupplierSheet">✕</button>
    <h2 id="supplierSheetTitle">Fournisseur</h2>
    <form id="supplierForm">
      <div class="field"><label>Nom</label><input type="text" id="s_name" required></div>
      <div class="field"><label>Contact (WeChat, tél...)</label><input type="text" id="s_contact" placeholder="WeChat ID, tél..."></div>
      <div class="field"><label>Note</label><textarea id="s_note" rows="3" placeholder="Produits, MOQ, remarques..."></textarea></div>
      <button type="submit" class="btn-primary">Enregistrer</button>
    </form>
    <div class="btn-row" style="margin-top:14px;">
      <button type="button" class="btn-secondary" id="deleteSupplierBtn">Supprimer</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const STATUS_META = {
  nouveau:   { label:'Nouvelle demande',   color:'var(--st-nouveau)'  },
  devis:     { label:'Devis envoyé',       color:'var(--st-devis)'    },
  paye:      { label:'Payé',               color:'var(--st-paye)'     },
  commande:  { label:'Commandé usine',     color:'var(--st-commande)' },
  expedie:   { label:'Expédié',            color:'var(--st-expedie)'  },
  livre:     { label:'Livré',              color:'var(--st-livre)'    },
  annule:    { label:'Annulé',             color:'var(--st-annule)'   }
};
const STATUS_FLOW = ['nouveau','devis','paye','commande','expedie','livre'];
const VIEW_BTN_IDS = { commandes:'viewBtnCommandes', clients:'viewBtnClients', suppliers:'viewBtnSuppliers', stats:'viewBtnStats' };

let orders = [];
let clients = [];
let suppliers = [];
let currentTab = 'tous';
let searchTerm = '';
let editingId = null;
let editingClientId = null;
let editingSupplierId = null;

const $ = (sel) => document.querySelector(sel);
const listEl = $('#list');
const tabsEl = $('#tabs');
const overlay = $('#overlay');
const form = $('#orderForm');
const rangeTabsEl = $('#rangeTabs');

const RANGE_DEFS = [
  { key:'7',   label:'7 jours',  days:7,   gran:'day'   },
  { key:'30',  label:'30 jours', days:30,  gran:'day'   },
  { key:'90',  label:'90 jours', days:90,  gran:'week'  },
  { key:'all', label:'Tout',     days:null, gran:'month' }
];
let currentRange = '30';
let viewState = 'commandes';

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtMoney(n){
  return (Math.round(n*100)/100).toLocaleString('fr-FR', {maximumFractionDigits:2}) + '€';
}
function fmtDate(ts){
  const d = new Date(ts);
  const diffDays = Math.floor((Date.now()-ts)/86400000);
  if(diffDays === 0) return "aujourd'hui";
  if(diffDays === 1) return 'hier';
  if(diffDays < 7) return `il y a ${diffDays}j`;
  return d.toLocaleDateString('fr-FR', {day:'2-digit', month:'2-digit'});
}
function showToast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2400);
}
function newId(prefix){ return prefix+Date.now()+Math.random().toString(36).slice(2,6); }

function orderTotalCost(o){ return (Number(o.unitCost)||0) * (Number(o.qty)||1); }
function orderTotalPrice(o){ return (Number(o.unitPrice)||0) * (Number(o.qty)||1); }
function orderMargin(o){ return orderTotalPrice(o) - orderTotalCost(o); }
function orderMultiplier(o){ const c = orderTotalCost(o); return c>0 ? orderTotalPrice(o)/c : null; }
function clientById(id){ return clients.find(c=>c.id===id); }
function clientName(o){ const c = clientById(o.clientId); return c ? c.name : 'Client supprimé'; }

async function storageGet(key){
  try{
    const r = await window.storage.get(key, false);
    return (r && r.value) ? JSON.parse(r.value) : [];
  }catch(e){ return []; }
}
async function storageSet(key, arr){
  try{
    const r = await window.storage.set(key, JSON.stringify(arr), false);
    if(!r) showToast('Sauvegarde impossible, réessaie');
  }catch(e){ showToast('Sauvegarde impossible, réessaie'); }
}
async function saveOrders(){ await storageSet('orders', orders); }
async function saveClients(){ await storageSet('clients', clients); }
async function saveSuppliers(){ await storageSet('suppliers', suppliers); }

function migrateOrders(){
  let changed = false;
  orders.forEach(o=>{
    if(!o.clientId){
      const name = (o.client||'').trim();
      let existing = name ? clients.find(c=>c.name.toLowerCase()===name.toLowerCase()) : null;
      if(!existing){
        existing = { id:newId('c'), name:name||'Client', contact:o.contact||'', address:'', createdAt:o.createdAt||Date.now() };
        clients.push(existing);
      }
      o.clientId = existing.id;
      changed = true;
    }
    if(o.unitCost===undefined || o.unitPrice===undefined){
      const qty = o.qty||1;
      o.unitCost = (o.cost!==undefined) ? (o.cost/qty) : (o.unitCost||0);
      o.unitPrice = (o.price!==undefined) ? (o.price/qty) : (o.unitPrice||0);
      changed = true;
    }
    delete o.client; delete o.contact; delete o.cost; delete o.price;
  });
  if(changed){ saveOrders(); saveClients(); }
}

function startOfDay(ts){ const d=new Date(ts); d.setHours(0,0,0,0); return d.getTime(); }
function startOfWeek(ts){ const d=new Date(startOfDay(ts)); const wd=(d.getDay()+6)%7; d.setDate(d.getDate()-wd); return d.getTime(); }
function startOfMonth(ts){ const d=new Date(ts); return new Date(d.getFullYear(), d.getMonth(), 1).getTime(); }
function bucketKeyFor(ts, gran){
  if(gran==='day') return startOfDay(ts);
  if(gran==='week') return startOfWeek(ts);
  return startOfMonth(ts);
}
function bucketLabel(ts, gran){
  const d = new Date(ts);
  if(gran==='day') return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'});
  if(gran==='week') return 'sem. '+d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'});
  return d.toLocaleDateString('fr-FR',{month:'short'});
}
function nextBucket(ts, gran){
  const d = new Date(ts);
  if(gran==='day') d.setDate(d.getDate()+1);
  else if(gran==='week') d.setDate(d.getDate()+7);
  else d.setMonth(d.getMonth()+1);
  return d.getTime();
}

function computeStats(){
  const rangeDef = RANGE_DEFS.find(r=>r.key===currentRange);
  const valid = orders.filter(o=>o.status!=='annule');
  const startTs = rangeDef.days ? (Date.now()-rangeDef.days*86400000)
                                : (valid.length ? Math.min(...valid.map(o=>o.createdAt)) : Date.now());
  const inRange = valid.filter(o=>o.createdAt>=startTs);
  const gran = rangeDef.gran;

  let cursor = bucketKeyFor(startTs, gran);
  const nowKey = bucketKeyFor(Date.now(), gran);
  let buckets = [];
  let safety = 0;
  while(cursor<=nowKey && safety<400){
    buckets.push({ key:cursor, label:bucketLabel(cursor,gran), revenue:0, margin:0 });
    cursor = nextBucket(cursor, gran);
    safety++;
  }
  if(buckets.length>10) buckets = buckets.slice(buckets.length-10);

  const bucketMap = {};
  buckets.forEach(b=>bucketMap[b.key]=b);
  inRange.forEach(o=>{
    const k = bucketKeyFor(o.createdAt, gran);
    const b = bucketMap[k];
    if(b){ b.revenue += orderTotalPrice(o); b.margin += orderMargin(o); }
  });

  const totalRevenue = inRange.reduce((s,o)=>s+orderTotalPrice(o),0);
  const totalMargin = inRange.reduce((s,o)=>s+orderMargin(o),0);
  const avgBasket = inRange.length ? totalRevenue/inRange.length : 0;
  const pctMargin = totalRevenue>0 ? (totalMargin/totalRevenue*100) : 0;

  return { buckets, totalRevenue, totalMargin, avgBasket, pctMargin };
}

function renderChart(buckets){
  const container = $('#chartContainer');
  if(!buckets.length || buckets.every(b=>b.revenue===0 && b.margin===0)){
    container.innerHTML = '<div class="empty" style="padding:26px 10px;">Pas encore de données sur cette période.</div>';
    return;
  }
  const W=320, H=170, padL=34, padR=8, padT=16, padB=24;
  const chartW=W-padL-padR, chartH=H-padT-padB;
  let maxV = Math.max(0, ...buckets.map(b=>Math.max(b.revenue,b.margin)));
  let minV = Math.min(0, ...buckets.map(b=>Math.min(b.margin,0)));
  if(maxV===0 && minV===0) maxV=1;
  const range = maxV-minV;
  const zeroY = padT + chartH*(maxV/range);
  const scaleY = v => padT + chartH*(maxV-v)/range;
  const groupW = chartW/buckets.length;

  let bars='';
  buckets.forEach((b,i)=>{
    const gx = padL + i*groupW;
    const rY = scaleY(b.revenue), rH = Math.max(Math.abs(zeroY-rY),1);
    const mY = scaleY(b.margin), mH = Math.max(Math.abs(zeroY-mY),1);
    const barW = groupW*0.32;
    bars += `<rect x="${(gx+groupW*0.13).toFixed(1)}" y="${Math.min(rY,zeroY).toFixed(1)}" width="${barW.toFixed(1)}" height="${rH.toFixed(1)}" rx="2" style="fill:#8a8a91"/>`;
    bars += `<rect x="${(gx+groupW*0.53).toFixed(1)}" y="${Math.min(mY,zeroY).toFixed(1)}" width="${barW.toFixed(1)}" height="${mH.toFixed(1)}" rx="2" style="fill:${b.margin>=0?'var(--gold)':'var(--danger)'}"/>`;
    bars += `<text x="${(gx+groupW/2).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="8.5" style="fill:var(--text-faint); font-family:'Inter',sans-serif;">${escapeHtml(b.label)}</text>`;
  });
  const svg = `<svg viewBox="0 0 ${W} ${H}" style="width:100%; height:auto; display:block;">
    <line x1="${padL}" y1="${zeroY.toFixed(1)}" x2="${W-padR}" y2="${zeroY.toFixed(1)}" style="stroke:var(--glass-border); stroke-width:1;"/>
    <text x="2" y="${padT+2}" font-size="8" style="fill:var(--text-faint); font-family:'Inter',sans-serif;">${fmtMoney(maxV)}</text>
    ${bars}
  </svg>`;
  container.innerHTML = svg;
}

function renderStats(){
  const s = computeStats();
  $('#statRevenue').textContent = fmtMoney(s.totalRevenue);
  $('#statMargin').textContent = fmtMoney(s.totalMargin);
  $('#statAvg').textContent = fmtMoney(s.avgBasket);
  $('#statPct').textContent = Math.round(s.pctMargin)+'%';
  renderChart(s.buckets);
}

function closeSupplierSheet(){ $('#supplierOverlay').classList.remove('open'); editingSupplierId=null; }

$('#supplierForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const name = $('#s_name').value.trim();
  if(!name){ showToast('Indique un nom'); return; }
  if(editingSupplierId){
    const s = suppliers.find(x=>x.id===editingSupplierId);
    s.name=name; s.contact=$('#s_contact').value.trim(); s.note=$('#s_note').value.trim();
  } else {
    suppliers.push({ id:newId('s'), name, contact:$('#s_contact').value.trim(), note:$('#s_note').value.trim(), createdAt:Date.now() });
  }
  await saveSuppliers();
  closeSupplierSheet();
  renderSuppliers();
  showToast('Fournisseur enregistré');
});
$('#closeSupplierSheet').addEventListener('click', closeSupplierSheet);
$('#supplierOverlay').addEventListener('click', (e)=>{ if(e.target===$('#supplierOverlay')) closeSupplierSheet(); });
$('#deleteSupplierBtn').addEventListener('click', async ()=>{
  if(!editingSupplierId) return;
  if(!confirm('Supprimer ce fournisseur ?')) return;
  suppliers = suppliers.filter(s=>s.id!==editingSupplierId);
  await saveSuppliers();
  closeSupplierSheet();
  renderSuppliers();
});

$('#resetBtn').addEventListener('click', async ()=>{
  if(!confirm('Réinitialiser toutes les données (commandes, clients, fournisseurs) ? Cette action est irréversible.')) return;
  orders = []; clients = []; suppliers = [];
  await saveOrders(); await saveClients(); await saveSuppliers();
  render();
});

loadAll();

setTimeout(()=>{
  const splash = document.getElementById('splash');
  if(splash){
    splash.classList.add('hide');
    setTimeout(()=>splash.remove(), 550);
  }
}, 1400);
</script>
</body>
</html>
